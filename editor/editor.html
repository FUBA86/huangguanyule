<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧情文案编辑器 · 无垠娱乐</title>
<style>
:root{
  --bg:#F6F8FC; --panel:#FFFFFF; --line:#E4E9F2; --line2:#D3DAE8;
  --text:#26303F; --muted:#71809A; --faint:#A2AEC2;
  --brand:#5A6BC4; --brand-soft:#EDF0FC; --brand-line:#C9D2F0;
  --ok:#2E8B62; --ok-soft:#E8F6EF;
  --warn:#B4762F; --warn-soft:#FDF4E7;
  --tag:#8B93A8;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  font-size:14px; display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer;}

/* ---------- 顶栏 ---------- */
#top{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:11px 20px; background:var(--panel); border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(38,48,63,.04); z-index:5;
}
#top h1{
  font-size:15px; margin:0; font-weight:800; letter-spacing:.02em;
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
#top h1 span{font-size:11px; font-weight:600; color:var(--faint); letter-spacing:0;}
.spacer{flex:1;}
#searchWrap{position:relative; width:280px; flex:0 0 auto;}
#top .btn{
  min-width:76px; display:inline-flex; align-items:center; justify-content:center;
  padding:7px 14px;
}
#search{
  width:100%; padding:7px 11px 7px 30px; border:1px solid var(--line2);
  border-radius:8px; background:#FBFCFE; font-size:13px; color:var(--text); outline:none;
}
#search:focus{border-color:var(--brand-line); background:#fff; box-shadow:0 0 0 3px rgba(90,107,196,.09);}
#searchWrap::before{
  content:"🔍"; position:absolute; left:9px; top:50%; transform:translateY(-50%);
  font-size:12px; opacity:.55;
}
.btn{
  padding:7px 14px; border-radius:8px; border:1px solid var(--line2);
  background:#fff; color:var(--text); font-size:13px; font-weight:600;
  transition:.14s; white-space:nowrap; flex:0 0 auto;
}
.btn:hover{background:#F3F6FC; border-color:var(--brand-line);}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
.btn.primary:hover{background:#4B5BB0;}
.btn.primary[disabled]{background:#C3CAE0; border-color:#C3CAE0; cursor:default;}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted);}
.btn.ghost:hover{background:#EFF3FA; color:var(--text);}

/* ---------- 主体 ---------- */
#main{flex:1; display:flex; min-height:0;}

/* 左侧目录 */
#side{
  flex:0 0 268px; background:var(--panel); border-right:1px solid var(--line);
  overflow-y:auto; padding:10px 0 40px;
}
#side::-webkit-scrollbar{width:8px;}
#side::-webkit-scrollbar-thumb{background:#DDE3EE; border-radius:4px;}
.grp{margin-bottom:2px;}
.grp-h{
  display:flex; align-items:center; gap:7px; padding:8px 16px;
  font-size:12.5px; font-weight:800; color:#4A5670; cursor:pointer;
  user-select:none; letter-spacing:.01em;
}
.grp-h:hover{background:#F5F8FD;}
.grp-h .ic{font-size:13px;}
.grp-h .cnt{margin-left:auto; font-size:10.5px; color:var(--faint); font-weight:600;}
.grp-h .arw{font-size:9px; color:var(--faint); transition:.15s;}
.grp.closed .arw{transform:rotate(-90deg);}
.grp.closed .grp-b{display:none;}
.grp-b{padding:0 0 6px;}
.item{
  padding:7px 16px 7px 32px; font-size:12.5px; color:#5B6478; cursor:pointer;
  border-left:3px solid transparent; line-height:1.5;
}
.item:hover{background:#F5F8FD; color:var(--text);}
.item.on{background:var(--brand-soft); border-left-color:var(--brand); color:var(--brand); font-weight:700;}
.item .nm{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item .nl{display:block; font-size:10.5px; color:var(--faint); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:400;}
.item.on .nl{color:#8794C4;}

/* 右侧内容 */
#content{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg);}

#head{
  flex:0 0 auto; padding:18px 30px 14px; background:var(--panel);
  border-bottom:1px solid var(--line);
}
#head .crumb{font-size:11.5px; color:var(--faint); font-weight:600; letter-spacing:.02em;}
#head .ttl{font-size:19px; font-weight:900; margin:5px 0 3px; letter-spacing:.01em;}
#head .note{font-size:12.5px; color:var(--muted); line-height:1.6;}
#head .bar{display:flex; align-items:center; gap:10px; margin-top:11px; flex-wrap:wrap;}
.pill{
  font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
  background:#F0F3FA; color:#6B7891;
}
.pill.ok{background:var(--ok-soft); color:var(--ok);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}

#body{flex:1; overflow-y:auto; padding:16px 30px 70px;}
#body::-webkit-scrollbar{width:10px;}
#body::-webkit-scrollbar-thumb{background:#D6DDEA; border-radius:5px;}

.sec-h{
  font-size:11.5px; font-weight:800; color:var(--faint); letter-spacing:.08em;
  margin:4px 0 12px; display:flex; align-items:center; gap:9px;
}
.sec-h::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,#E2E8F2,transparent);}

/* 文档式：一句一行，点哪改哪 */
.card{
  position:relative; padding:6px 12px 6px 40px; margin:0 0 1px;
  border-radius:7px; border:1px solid transparent;
  transition:background .13s, border-color .13s;
}
.card:hover{background:#FFFFFF; border-color:#E9EDF5; box-shadow:0 1px 3px rgba(38,48,63,.04);}
.card:focus-within{background:#fff; border-color:var(--brand-line); box-shadow:0 0 0 3px rgba(90,107,196,.08);}
.card.changed{background:#F7FCF9; border-color:#CFE7DA;}
.card.flash{animation:flash 1.5s ease;}
@keyframes flash{0%,100%{background:transparent;}18%{background:#FFF8E0; border-color:#EBD79A;}}

.card .meta{
  position:absolute; left:9px; top:7px; width:24px;
  display:flex; flex-direction:column; align-items:flex-end; gap:3px;
}
.card .no{
  font-size:10px; font-weight:800; color:#C3CBDA;
  font-variant-numeric:tabular-nums; line-height:1.5;
}
.card.changed .no{color:#8FBBA5;}
.line{display:flex; align-items:baseline; gap:8px;}
.kind{
  flex:0 0 auto; font-size:10px; font-weight:800; padding:1px 7px; border-radius:5px;
  letter-spacing:.02em; white-space:nowrap; transform:translateY(-1px);
}
.kind.macro{background:#FBEDF2; color:#A8566F;}
.kind.link{background:#FBEDF2; color:#A8566F;}
.kind.value{background:#F1F4F9; color:#6E7A94;}
.kind.attr{background:#F0F5EC; color:#5E7A4E;}
.card .dirty{display:none; font-size:10px; color:var(--ok); font-weight:800;}
.card.changed .dirty{display:inline; position:absolute; right:12px; top:9px;}
.card .undo-one{
  display:none; font-size:10px; color:var(--faint); cursor:pointer;
  position:absolute; right:12px; bottom:9px;
  text-decoration:underline; text-underline-offset:2px;
}
.card.changed:hover .undo-one{display:inline;}

.ed{
  flex:1; min-width:0;
  font-size:14.5px; line-height:1.95; color:#1F2937; outline:none;
  padding:2px 3px; margin:-2px -3px; border-radius:5px; word-break:break-word;
  min-height:1.95em;
}
.ed:empty::before{content:"（这处是空的，可以写字）"; color:#C6CDDA;}
.ed:focus{background:#FDFEFF;}

/* 槽位：用户不能改的部分 */
.slot{
  display:inline-block; padding:0 4px; margin:0 1px;
  background:#EEF1F7; color:#8B95A9; border-radius:4px;
  font-size:11.5px; font-weight:600; vertical-align:baseline;
  user-select:none; cursor:default; letter-spacing:0;
}
.slot.tag{background:#F0F3F9; color:#8E98AC;}
.slot.v{background:#FBF3E4; color:#A07B3C;}
.slot.num{background:#FBF3E4; color:#A07B3C; font-size:11px;}
.slot.pre{flex:0 0 auto; transform:translateY(-1px); opacity:.85;}
.slot.gap{padding:0; margin:0; background:transparent; font-size:0; line-height:0; width:0;}

/* 空状态 */
#empty{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--faint); gap:14px; text-align:center; padding:40px;
}
#empty .big{font-size:44px; opacity:.5;}
#empty h2{font-size:16px; color:#5B6478; margin:0; font-weight:800;}
#empty p{margin:0; font-size:13px; line-height:2; max-width:400px;}
#empty .steps{
  display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; justify-content:center;
}
#empty .step{
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:11px 16px; font-size:12.5px; color:#5B6478; text-align:left; min-width:150px;
  line-height:1.7;
}
#empty .step b{display:block; color:var(--brand); font-size:11px; margin-bottom:3px;}

/* 搜索结果 */
#results{flex:1; overflow-y:auto; padding:20px 30px 60px;}
.res{
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:12px 15px; margin-bottom:9px; cursor:pointer;
}
.res:hover{border-color:var(--brand-line); box-shadow:0 2px 8px rgba(90,107,196,.07);}
.res .rt{font-size:13.5px; font-weight:800; color:var(--text);}
.res .rg{font-size:11px; color:var(--faint); margin:3px 0 7px;}
.res .rh{font-size:12.5px; color:#5B6478; line-height:1.7; padding:3px 0;
  border-bottom:1px dashed #EEF1F7;}
.res .rh:last-child{border:none;}
.res mark{background:#FFF0B8; color:#8A6314; padding:0 2px; border-radius:2px; font-weight:700;}

/* 预览浮层 */
#pv{
  position:fixed; top:0; right:0; bottom:0; width:430px; max-width:92vw;
  background:#fff; border-left:1px solid var(--line); box-shadow:-8px 0 30px rgba(38,48,63,.1);
  display:flex; flex-direction:column; z-index:30; transform:translateX(100%);
  transition:transform .22s ease;
}
#pv.on{transform:translateX(0);}
#pv .ph{
  flex:0 0 auto; padding:10px 14px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color:#4A5670;
}
#pv .ph .spacer{flex:1;}
#pv iframe{flex:1; border:0; width:100%; background:#F6F8FC;}
#pv .pn{font-size:11px; color:var(--faint); padding:8px 14px; border-top:1px solid var(--line); line-height:1.6;}

#toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px);
  background:#1E2836; color:#fff; padding:11px 20px; border-radius:9px;
  font-size:13px; font-weight:600; opacity:0; pointer-events:none;
  transition:.22s; z-index:60; box-shadow:0 8px 24px rgba(30,40,54,.25);
}
#toast.on{opacity:1; transform:translate(-50%,0);}
#toast.ok{background:#25775A;}
#toast.err{background:#A8454F;}


@media (max-width: 860px){
  #side{flex:0 0 210px;}
  #head, #body, #results{padding-left:16px; padding-right:16px;}
    #searchWrap{width:150px;}
}
</style>
</head>
<body>

<div id="top">
  <h1>📖 剧情文案编辑器 <span>无垠娱乐 · CEO</span></h1>
  <div id="searchWrap">
    <input id="search" placeholder="搜一句台词，直接跳过去…" autocomplete="off">
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnUndo" title="把上一次保存前的文件还原">↶ 撤销</button>
  <button class="btn primary" id="btnSaveTop" disabled>💾 保存</button>
</div>

<div id="main">
  <div id="side"></div>

  <div id="content">
    <div id="empty">
      <div class="big">👈</div>
      <h2>从左边挑一屏开始改</h2>
      <p>左边是按游戏里的剧情顺序排的目录。<br>点开一屏，看到的就是玩家会读到的每一句话，直接在上面改字就行。</p>
      <div class="steps">
        <div class="step"><b>只改字</b>代码、数字、跳转都不会动<br>灰色小方块是受保护的</div>
        <div class="step"><b>不会改坏</b>每次保存都自动备份<br>改错了能一键撤销</div>
      </div>
    </div>

    <div id="head" style="display:none"></div>
    <div id="body" style="display:none"></div>
    <div id="results" style="display:none"></div>
  </div>
</div>

<div id="pv">
  <div class="ph">
    <span>👁 预览这一屏</span>
    <div class="spacer"></div>
    <button class="btn ghost" id="pvRefresh" style="padding:4px 9px;">刷新</button>
    <button class="btn ghost" id="pvClose" style="padding:4px 9px;">关闭</button>
  </div>
  <iframe id="pvFrame" src="about:blank"></iframe>
  <div class="pn">⚠️ 这里只是看文字效果：<b>预览页不存档</b>，也别在预览里点「存档」。
    想真的玩、真的存档，用编辑器窗口里提示的「游戏」网址打开
    <code>/index.html</code>（或者双击 启动游戏.bat）。</div>
</div>

<div id="toast"></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var S = {
  groups: [],
  cur: null,          // 当前单元 key
  segs: [],           // 后端返回的 segs
  orig: [],           // 原始文本快照 [[t0,t1],[t0],...]
  changed: {},        // segIdx -> {innerIdx: text}
  searching: false
};

/* ============================ 工具 ============================ */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function api(url, opt) {
  return fetch(url, opt).then(function (r) {
    return r.json().then(function (d) { return d; });
  });
}
var toastTimer;
function toast(msg, tone) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'on' + (tone ? ' ' + tone : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ''; }, 2600);
}

/* ============================ 目录 ============================ */
function loadTree() {
  return api('/api/tree').then(function (d) {
    S.groups = d.groups || [];
    renderSide();
  });
}

function renderSide() {
  var box = $('side');
  var html = '';
  S.groups.forEach(function (g, gi) {
    var n = g.units.length;
    var closed = (gi > 6 && n < 4) ? ' closed' : '';
    html += '<div class="grp' + closed + '" data-g="' + gi + '">';
    html += '<div class="grp-h"><span class="arw">▼</span><span class="ic">' + g.icon + '</span>';
    html += '<span>' + esc(g.name) + '</span><span class="cnt">' + n + '</span></div>';
    html += '<div class="grp-b">';
    g.units.forEach(function (u, ui) {
      var on = (S.cur === u.key) ? ' on' : '';
      var nm = u.title.replace(/^第\s*\d+\s*月\s*·\s*/, '');
      html += '<div class="item' + on + '" data-k="' + u.key + '" data-g="' + gi + '" data-u="' + ui + '">';
      html += '<span class="nm">' + esc(u.title) + '</span>';
      html += '<span class="nl">' + esc(u.note) + '</span></div>';
    });
    html += '</div></div>';
  });
  box.innerHTML = html;

  box.querySelectorAll('.grp-h').forEach(function (h) {
    h.onclick = function () { h.parentNode.classList.toggle('closed'); };
  });
  box.querySelectorAll('.item').forEach(function (it) {
    it.onclick = function () { openUnit(it.dataset.k); };
  });
}

/* ============================ 打开一屏 ============================ */
function hasDirty() {
  for (var k in S.changed) { if (Object.keys(S.changed[k]).length) return true; }
  return false;
}

function openUnit(key) {
  if (key === S.cur) return;
  if (hasDirty() && !confirm('这一屏有还没保存的改动，切走会丢掉。确定要切吗？')) return;

  S.cur = key; S.changed = {}; S.segs = []; S.orig = [];
  S.searching = false;
  $('empty').style.display = 'none';
  $('results').style.display = 'none';
  $('head').style.display = 'block';
  $('body').style.display = 'block';
  $('body').innerHTML = '<div style="color:#A2AEC2;padding:30px 0;">读取中…</div>';

  renderSide();
  var cur = $('side').querySelector('.item.on');
  if (cur) { var gp = cur.closest('.grp'); if (gp) gp.classList.remove('closed'); cur.scrollIntoView({ block: 'center' }); }
  var g = findUnit(key);

  api('/api/unit?k=' + encodeURIComponent(key)).then(function (d) {
    if (d.error) { toast(d.error, 'err'); return; }
    S.segs = d.segs || [];
    S.orig = S.segs.map(function (s) {
      return s.inner.map(function (q) { return q.t === 'text' ? q.v : null; });
    });
    $('head').innerHTML =
      '<div class="crumb">' + esc(d.meta.icon + ' ' + d.meta.group) + '</div>' +
      '<div class="ttl">' + esc(d.meta.title) + '</div>' +
      '<div class="note">' + esc(d.meta.note || '') + '</div>' +
      '<div class="bar">' +
      '<span class="pill" id="cntAll"></span>' +
      '<span class="pill ok" id="cntDone" style="display:none"></span>' +
      '<button class="btn ghost" id="btnPv" style="padding:4px 11px;margin-left:auto;">👁 预览这一屏</button>' +
      '</div>';
    $('btnPv').onclick = openPreview;
    renderBody();
    updateSum();
    $('body').scrollTop = 0;
  });
}

function findUnit(key) {
  for (var i = 0; i < S.groups.length; i++) {
    for (var j = 0; j < S.groups[i].units.length; j++) {
      if (S.groups[i].units[j].key === key) return S.groups[i].units[j];
    }
  }
  return null;
}

var KIND_LABEL = { text: '正文', link: '按钮', macro: '文字', value: '数据', attr: '提示文字' };

function renderBody() {
  var html = '';
  var curKind = null;
  S.segs.forEach(function (s, si) {
    if (s.kind !== curKind) {
      curKind = s.kind;
    }
    var txt = s.inner.filter(function (q) { return q.t === 'text'; })
      .map(function (q) { return q.v; }).join('').trim();
    var ctx = (s.prev && txt.length < 9) ? ('承接上一句：' + s.prev) : '';
    html += '<div class="card" data-s="' + si + '" data-kind="' + s.kind + '"'
      + (ctx ? ' title="' + esc(ctx) + '"' : '') + '>';
    html += '<div class="meta"><span class="no">' + (si + 1) + '</span></div>';
    html += '<span class="dirty">● 已改</span>';
    html += '<span class="undo-one" data-u="' + si + '">还原这句</span>';
    html += '<div class="line">';
    if (s.kind !== 'text') {
      html += '<span class="kind ' + s.kind + '">' + (KIND_LABEL[s.kind] || '文字') + '</span>';
    }
    if (s.pre) {
      html += '<span class="slot num pre" title="这里会自动填一个数（' + esc(s.pre)
        + '），不用改">自动</span>';
    }
    html += '<div class="ed" contenteditable="true" spellcheck="false" data-s="' + si + '">';
    html += renderInner(s.inner);
    html += '</div></div></div>';
  });
  if (!S.segs.length) {
    html = '<div style="color:#A2AEC2;padding:26px 0;font-size:13px;">这一屏里没有玩家能看到的文字（是纯逻辑页面），不用改。</div>';
  }
  $('body').innerHTML = html;

  $('body').querySelectorAll('.ed').forEach(function (el) {
    el.addEventListener('input', function () { onEdit(el); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); }
    });
    el.addEventListener('paste', function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, t.replace(/[\r\n]+/g, ' '));
    });
    el.addEventListener('blur', function () {
      var v = collect(el);
      var t = v.join('');
      if (!t.trim() && el.getAttribute('data-was') !== '1') {
        // 允许清空，但给个提示
      }
    });
  });
  $('body').querySelectorAll('.undo-one').forEach(function (b) {
    b.onclick = function () {
      var si = +b.dataset.u;
      var el = $('body').querySelector('.ed[data-s="' + si + '"]');
      el.innerHTML = renderInner(S.segs[si].inner);
      delete S.changed[si];
      mark(si, false);
      updateSum();
    };
  });
}

function renderInner(inner) {
  var out = '';
  inner.forEach(function (q) {
    if (q.t === 'text') {
      out += esc(q.v);
    } else if (q.cls === 'gap' || !q.label) {
      out += '<span class="slot gap" data-slot="1">' + esc(q.label || '') + '</span>';
    } else if (q.cls === 'num' || q.cls === 'v') {
      out += '<span class="slot num" data-slot="1" title="这里会自动填一个数（'
        + esc(q.label) + '），不用改">自动</span>';
    } else {
      out += '<span class="slot ' + (q.cls || '') + '" data-slot="1" title="这一块是代码，改不了">'
        + esc(q.label) + '</span>';
    }
  });
  return out;
}

/* 从 contenteditable 里按顺序取出所有 text 片段（跳过槽位） */
function collect(el) {
  var out = [];
  (function walk(node) {
    for (var i = 0; i < node.childNodes.length; i++) {
      var c = node.childNodes[i];
      if (c.nodeType === 3) {
        out.push(c.nodeValue);
      } else if (c.nodeType === 1) {
        if (c.dataset && c.dataset.slot !== undefined) continue;
        if (c.tagName === 'BR') { out.push(''); continue; }
        walk(c);
      }
    }
  })(el);
  return out;
}

function onEdit(el) {
  var si = +el.dataset.s;
  var vals = collect(el);
  var origs = S.orig[si];
  // vals 与 inner 中的 text 项一一对应
  var texts = [];
  S.segs[si].inner.forEach(function (q, ii) { if (q.t === 'text') texts.push(ii); });
  var diff = {};
  for (var k = 0; k < texts.length; k++) {
    var nv = (vals[k] !== undefined ? vals[k] : '');
    if (nv !== origs[texts[k]]) diff[texts[k]] = nv;
  }
  if (Object.keys(diff).length) S.changed[si] = diff;
  else delete S.changed[si];
  mark(si, !!Object.keys(diff).length);
  updateSum();
}

function mark(si, on) {
  var card = $('body').querySelector('.card[data-s="' + si + '"]');
  if (card) card.classList.toggle('changed', on);
}

function updateSum() {
  var nSeg = S.segs.length;
  var nDone = Object.keys(S.changed).length;
  var all = $('cntAll'), done = $('cntDone');
  if (all) all.textContent = '这一屏共 ' + nSeg + ' 处文字';
  if (done) {
    done.style.display = nDone ? '' : 'none';
    done.textContent = '已改 ' + nDone + ' 处';
  }
  ['btnSave', 'btnSaveTop'].forEach(function (id) {
    var b = $(id);
    if (!b) return;
    b.disabled = nDone === 0;
    b.textContent = nDone ? ('💾 保存 ' + nDone + ' 处') : '💾 保存';
  });
}

/* ============================ 保存 ============================ */
function save() {
  if (!hasDirty()) return;
  var edits = [];
  for (var si in S.changed) {
    var cells = [];
    for (var ii in S.changed[si]) cells.push([+si, +ii, S.changed[si][ii]]);
    edits.push({ key: S.cur, cells: cells });
  }
  if (!edits.length) return;

  ['btnSave', 'btnSaveTop'].forEach(function (id) {
    var b = $(id); if (b) { b.disabled = true; b.textContent = '保存中…'; }
  });
  api('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ edits: edits })
  }).then(function (d) {
    if (d.error) { toast('保存失败：' + d.error, 'err'); updateSum(); return; }
    toast('已保存 ✓ 打开游戏刷新一下就能看到', 'ok');
    try { new BroadcastChannel('twee-editor').postMessage('reload'); } catch (e) { }
    // 更新快照：把当前值当成新的原值
    for (var si in S.changed) {
      var idxs = Object.keys(S.changed[si]);
      for (var k = 0; k < idxs.length; k++) {
        var ii = +idxs[k];
        S.orig[si][ii] = S.changed[si][ii];
      }
    }
    S.changed = {};
    $('body').querySelectorAll('.card').forEach(function (c) { c.classList.remove('changed'); });
    updateSum();
    if ($('pv').classList.contains('on')) $('pvFrame').src = $('pvFrame').src;
  }).catch(function (e) {
    toast('连不上本地服务了，请检查那个黑色窗口还在不在', 'err');
    updateSum();
  });
}
$('btnSaveTop').onclick = save;

document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault(); save();
  }
});
window.addEventListener('beforeunload', function (e) {
  if (hasDirty()) { e.preventDefault(); e.returnValue = ''; }
});

/* ============================ 撤销 ============================ */
$('btnUndo').onclick = function () {
  if (!confirm('把文件还原到「上一次保存之前」的样子？\n（本次打开以来保存过的所有改动都会回退）')) return;
  api('/api/undo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
    .then(function (d) {
      if (d.error) { toast(d.error, 'err'); return; }
      toast('已还原 ' + d.restored + ' 个文件', 'ok');
      S.changed = {};
      if (S.cur) { var k = S.cur; S.cur = null; openUnit(k); }
    });
};

/* ============================ 预览 ============================ */
function openPreview() {
  var u = findUnit(S.cur);
  var name = S.cur.split(':', 1)[0] === 'P' ? S.cur.slice(2) : '';
  var url = name
    ? ('/index.html?p=' + encodeURIComponent(name) + (u && u.month ? '&m=' + u.month : ''))
    : '/index.html';
  $('pvFrame').src = url;
  $('pv').classList.add('on');
}
$('pvClose').onclick = function () { $('pv').classList.remove('on'); };
$('pvRefresh').onclick = function () { $('pvFrame').src = $('pvFrame').src; };

/* ============================ 搜索 ============================ */
var searchTimer;
$('search').oninput = function () {
  var q = this.value.trim();
  clearTimeout(searchTimer);
  if (!q) { exitSearch(); return; }
  searchTimer = setTimeout(function () { doSearch(q); }, 220);
};
$('search').onkeydown = function (e) {
  if (e.key === 'Escape') { this.value = ''; exitSearch(); this.blur(); }
};

function doSearch(q) {
  if (hasDirty() && !confirm('有没保存的改动，搜索会离开这一屏。继续？')) { return; }
  api('/api/search?q=' + encodeURIComponent(q)).then(function (d) {
    var rs = d.results || [];
    S.searching = true;
    $('empty').style.display = 'none';
    $('head').style.display = 'none';
    $('body').style.display = 'none';
    var box = $('results');
    box.style.display = 'block';
    if (!rs.length) {
      box.innerHTML = '<div style="color:#A2AEC2;padding:30px 0;">没搜到「' + esc(q) + '」。试试短一点的词。</div>';
      return;
    }
    var html = '<div class="sec-h">找到 ' + rs.length + ' 屏，共 '
      + rs.reduce(function (a, b) { return a + b.n; }, 0) + ' 处</div>';
    rs.forEach(function (r) {
      html += '<div class="res" data-k="' + r.key + '">';
      html += '<div class="rt">' + esc(r.title) + '</div>';
      html += '<div class="rg">' + esc(r.icon + ' ' + r.group) + (r.n > r.hits.length ? ' · 共 ' + r.n + ' 处' : '') + '</div>';
      r.hits.forEach(function (h) {
        html += '<div class="rh">' + hi(h.text, q) + '</div>';
      });
      html += '</div>';
    });
    box.innerHTML = html;
    box.querySelectorAll('.res').forEach(function (el) {
      el.onclick = function () {
        S.changed = {};
        S.searching = false;
        $('results').style.display = 'none';
        S.cur = null;
        openUnit(el.dataset.k);
      };
    });
  });
}

function hi(text, q) {
  var e = esc(text);
  var qe = esc(q);
  var i = e.toLowerCase().indexOf(qe.toLowerCase());
  if (i < 0) return e;
  return e.slice(0, i) + '<mark>' + e.slice(i, i + qe.length) + '</mark>' + e.slice(i + qe.length);
}

function exitSearch() {
  if (!S.searching) return;
  S.searching = false;
  $('results').style.display = 'none';
  if (S.cur) {
    $('head').style.display = 'block';
    $('body').style.display = 'block';
    } else {
    $('empty').style.display = 'flex';
  }
}

/* ============================ 启动 ============================ */
loadTree().then(function () {
  // 默认收起后面的分组，界面别太挤
  var grps = $('side').querySelectorAll('.grp');
  grps.forEach(function (g, i) { if (i > 2) g.classList.add('closed'); });

  // 支持直接打开某一屏：editor.html?k=P:Story_Act1_01_Scandal
  var k = new URLSearchParams(location.search).get('k');
  if (k) {
    var gi = -1;
    S.groups.forEach(function (g, i) {
      g.units.forEach(function (u) { if (u.key === k) gi = i; });
    });
    if (gi >= 0) {
      var gEl = $('side').querySelector('.grp[data-g="' + gi + '"]');
      if (gEl) gEl.classList.remove('closed');
    }
    openUnit(k);
  }
});
</script>
